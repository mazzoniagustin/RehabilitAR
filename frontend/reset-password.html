<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RehabilitAR — Restablecer contraseña</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div class="bg-shapes"><span></span><span></span><span></span></div>

<div class="app">
  <div class="card">

    <div class="brand">
      <img src="assets/RehabilitAR.png" class="brand-logo" alt="RehabilitAR"/>
      <h1>RehabilitAR</h1>
      <p>Restablecer contraseña</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <div id="loadingView" style="text-align:center;padding:20px 0;color:var(--muted);font-size:.9rem">
      Verificando enlace...
    </div>

    <!-- Vista: formulario nueva contraseña -->
    <div id="resetView" style="display:none">
      <div class="form-group">
        <label>Nueva contraseña</label>
        <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres"/>
      </div>
      <div class="form-group">
        <label>Confirmar contraseña</label>
        <input type="password" id="confirmPassword" placeholder="Repetí la contraseña"/>
      </div>
      <button class="btn" id="resetBtn" onclick="handleReset()">Guardar nueva contraseña</button>
    </div>

    <!-- Vista: enlace inválido o expirado -->
    <div id="errorView" style="display:none;text-align:center">
      <p style="color:var(--muted);font-size:.88rem;margin-bottom:16px">
        El enlace es inválido o expiró. Solicitá uno nuevo.
      </p>
      <a href="login.html" class="btn" style="display:inline-block;text-decoration:none;padding:11px 24px;width:auto">
        Volver al inicio de sesión
      </a>
    </div>

  </div>
</div>

<script>
const API = 'http://localhost:8000';

let accessToken = null;

function showAlert(msg, type = 'error') {
  const el = document.getElementById('alertBox');
  el.textContent = msg;
  el.className = `alert ${type} show`;
}

function setLoading(on) {
  const btn = document.getElementById('resetBtn');
  btn.disabled = on;
  btn.innerHTML = on ? '<span class="spinner"></span>Guardando...' : 'Guardar nueva contraseña';
}

async function init() {
  await new Promise(r => setTimeout(r, 100));
  const hash   = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const token  = params.get('access_token');
  const type   = params.get('type');

  document.getElementById('loadingView').style.display = 'none';

  if (!token || type !== 'recovery') {
    document.getElementById('errorView').style.display = 'block';
    return;
  }

  accessToken = token;
  document.getElementById('resetView').style.display = 'block';
}

async function handleReset() {
  const newPw     = document.getElementById('newPassword').value;
  const confirmPw = document.getElementById('confirmPassword').value;

  if (!newPw || newPw.length < 6)
    return showAlert('La contraseña debe tener al menos 6 caracteres.');
  if (newPw !== confirmPw)
    return showAlert('Las contraseñas no coinciden.');

  setLoading(true);

  try {
    const res  = await fetch(`${API}/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: accessToken, password: newPw })
    });

    const data = await res.json();

    if (!res.ok) {
      showAlert(data.detail || data.error || 'Error al actualizar.');
    } else {
      showAlert('Contraseña actualizada correctamente.', 'success');
      setTimeout(() => location.href = 'login.html', 2000);
    }
  } catch {
    showAlert('No se pudo conectar con el servidor.');
  } finally {
    setLoading(false);
  }
}

init();
</script>
</body>
</html>
