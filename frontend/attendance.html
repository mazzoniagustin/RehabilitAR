<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Registrar asistencia — RehabilitAR</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css"/>
</head>

<body>

  <div class="app">

    <div class="card" style="max-width:430px">

      <div class="brand">

        <img
          src="assets/RehabilitAR.png"
          class="brand-logo"
          alt="RehabilitAR"
        />

        <h1>Registrar asistencia</h1>

        <p>
          Ingresá el correo electrónico asociado a tu cuenta
          para confirmar tu presencia en la clase.
        </p>

      </div>

      <div
        id="attendancePublicAlert"
        class="alert"
      ></div>

      <div id="attendancePublicForm">

        <div class="form-group">

          <label for="attendanceDni">
            Correo electrónico
          </label>

          <input
            type="email"
            id="attendanceEmail"
            autocomplete="email"
            placeholder="Ej: cliente@email.com"
          />

        </div>

        <button
          class="btn"
          id="attendanceSubmitButton"
          onclick="submitQrAttendance()"
        >
          Registrar presente
        </button>

      </div>

    </div>

  </div>

  <script src="attendance.js"></script>

</body>
</html>
